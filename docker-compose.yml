services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podman-compose-html-demo
    ports:
      - "${PORT:-3000}:80"
    restart: unless-stopped
    environment:
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
